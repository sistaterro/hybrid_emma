<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emma · Settings</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --border: rgba(0, 0, 0, 0.08);
      --text: #1d1d1f;
      --text2: #86868b;
      --blue: #0071e3;
      --blue-light: #e8f1fb;
      --green: #34c759;
      --sidebar-w: 240px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

    #sidebar {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: rgba(255, 255, 255, 0.8);
      border-right: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 24px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
    }

    .hal-eye { position: relative; width: 36px; height: 36px; flex: 0 0 auto; }
    .hal-eye::before, .hal-eye::after { content: ''; position: absolute; inset: 0; border: 1px solid rgba(0,113,227,.18); border-radius: 50%; }
    .hal-eye::after { inset: 6px; border-color: rgba(0,113,227,.1); }
    .hal-lens { position: absolute; inset: 11px; border-radius: 50%; background: #0071e3; box-shadow: 0 0 14px rgba(0,113,227,.4); }

    main { padding: 48px; }

    .page-header {
      max-width: 900px;
      margin: 0 auto 28px;
    }

    h1 { font-size: 32px; font-weight: 650; letter-spacing: -0.02em; }

    .settings-card {
      max-width: 900px;
      margin: 0 auto;
      padding: 28px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0,0,0,.05);
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
    }

    .setting-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .setting-title { font-weight: 600; }
    .setting-description { margin-top: 4px; color: var(--text2); font-size: 13px; }

    .switch { position: relative; width: 48px; height: 28px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; cursor: pointer; border-radius: 999px; background: #d2d2d7; transition: .2s; }
    .slider::before { content: ''; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; border-radius: 50%; background: white; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: .2s; }
    .switch input:checked + .slider { background: var(--green); }
    .switch input:checked + .slider::before { transform: translateX(20px); }

    select {
      min-width: 220px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--text);
      font: inherit;
    }

    @media (max-width: 720px) {
      #app { display: block; }
      #sidebar { min-height: auto; }
      main { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <a class="brand" href="/ui/index.html" title="Home" aria-label="Return to Home">
        <span class="hal-eye" aria-hidden="true"><span class="hal-lens"></span></span>
        <span>Settings</span>
      </a>
    </aside>

    <main>
      <div class="page-header">
        <h1>Settings</h1>
      </div>
      <section class="settings-card" aria-label="Emma settings">
        <div class="setting-row">
          <div>
            <div class="setting-title">Manipulation detection</div>
            <div class="setting-description">Analyze user messages for pressure, bypass attempts, and social engineering.</div>
          </div>
          <label class="switch" aria-label="Enable manipulation detection">
            <input id="manipulationDetection" type="checkbox" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <div>
            <div class="setting-title">Detection model</div>
            <div class="setting-description">Model used to evaluate possible manipulation before answering.</div>
          </div>
          <select id="detectionModel" aria-label="Detection model">
            <option value="default">Default model</option>
            <option value="qwen3.5:9b">qwen3.5:9b</option>
            <option value="qwen2.5:7b">qwen2.5:7b</option>
          </select>
        </div>
      </section>
    </main>
  </div>
  <script>
    const API_HOST = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'localhost' : location.hostname;
    const API_BASE_URL = `http://${API_HOST}:8650`;
    const STORAGE_KEY = 'emma.settings';
    const detectionToggle = document.getElementById('manipulationDetection');
    const detectionModel = document.getElementById('detectionModel');
    let settingsAuthorized = false;

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        if (typeof saved.manipulationDetection === 'boolean') detectionToggle.checked = saved.manipulationDetection;
        if (saved.detectionModel) detectionModel.value = saved.detectionModel;
      } catch (_) { /* Use defaults when local settings are unavailable. */ }
    }

    function savedSettings() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      } catch (_) {
        return {};
      }
    }

    function saveSettings() {
      const values = {
        manipulationDetection: detectionToggle.checked,
        detectionModel: detectionModel.value,
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(values));
      if (settingsAuthorized && detectionModel.value) {
        fetch(`${API_BASE_URL}/admin/settings`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${localStorage.getItem('emma_token')}` },
          body: JSON.stringify({
            manipulation_detection_enabled: detectionToggle.checked,
            manipulation_detection_model: detectionModel.value,
          }),
        }).catch(() => {});
      }
    }

    function renderModelOptions(models) {
      const normalized = (models || []).map(model => typeof model === 'string' ? { id: model, label: model } : model);
      const selected = savedSettings().detectionModel;
      if (!normalized.length) {
        detectionModel.innerHTML = '<option value="">No model configured</option>';
        detectionModel.disabled = true;
        return;
      }
      detectionModel.disabled = false;
      detectionModel.innerHTML = normalized.map(model => {
        const label = model.label || model.id;
        const source = model.source_label || (model.source === 'external_apis' ? 'External APIs' : 'Local');
        const provider = model.provider && model.provider !== 'local' ? ` / ${model.provider.toUpperCase()}` : '';
        return `<option value="${escapeHtml(model.id)}">${escapeHtml(`${source}${provider} / ${label}`)}</option>`;
      }).join('');
      if (normalized.some(model => model.id === selected)) detectionModel.value = selected;
      else detectionModel.value = normalized[0].id;
      saveSettings();
    }

    function escapeHtml(value) {
      return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function loadModels() {
      const token = localStorage.getItem('emma_token');
      const response = await fetch(`${API_BASE_URL}/health`, { headers: { Authorization: `Bearer ${token}` } });
      if (!response.ok) throw new Error('Could not load models');
      const data = await response.json();
      renderModelOptions(data?.models || []);
    }

    async function loadRemoteSettings() {
      const token = localStorage.getItem('emma_token');
      const response = await fetch(`${API_BASE_URL}/admin/settings`, { headers: { Authorization: `Bearer ${token}` } });
      if (!response.ok) throw new Error('Could not load settings');
      const data = await response.json();
      detectionToggle.checked = data.manipulation_detection_enabled;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        manipulationDetection: data.manipulation_detection_enabled,
        detectionModel: data.manipulation_detection_model,
      }));
    }

    async function authorizeSettings() {
      const token = localStorage.getItem('emma_token');
      if (!token) {
        window.location.href = '/ui/login.html';
        return;
      }
      try {
        const response = await fetch(`${API_BASE_URL}/admin/settings/access`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (response.status === 401) {
          localStorage.removeItem('emma_token');
          window.location.href = '/ui/login.html';
          return;
        }
        if (response.status === 403) {
          window.location.href = '/ui/index.html';
          return;
        }
        if (!response.ok) throw new Error('Settings authorization failed');
        await loadRemoteSettings();
        settingsAuthorized = true;
        await loadModels();
      } catch (_) {
        window.location.href = '/ui/index.html';
      }
    }

    detectionToggle.addEventListener('change', saveSettings);
    detectionModel.addEventListener('change', saveSettings);
    loadSettings();
    authorizeSettings();
  </script>
</body>
</html>
